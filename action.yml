name: MCP preflight
description: Check an MCP server is ready for Alexa+ and other voice assistants.
branding:
  icon: check-circle
  color: blue
inputs:
  url:
    description: Streamable HTTP endpoint to check
    required: true
  args:
    description: Extra mcp-preflight arguments, e.g. "--call --min-score 80"
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: pip install "${{ github.action_path }}"
    - shell: bash
      run: mcp-preflight "${{ inputs.url }}" ${{ inputs.args }} --markdown preflight.md; status=$?; cat preflight.md >> "$GITHUB_STEP_SUMMARY"; exit $status
